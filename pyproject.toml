[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mkdocs-nested-tabs"
version = "0.1.0"
description = "Display two levels of navigation.tabs instead of Material's hover-only dropdown."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[project.entry-points."mkdocs.plugins"]
nested-tabs = "mkdocs_nested_tabs.plugin:NestedTabsPlugin"

[tool.setuptools.packages.find]
include = ["mkdocs_nested_tabs*"]

[tool.setuptools.package-data]
mkdocs_nested_tabs = ["static/*"]
