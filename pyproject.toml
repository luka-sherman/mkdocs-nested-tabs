[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mkdocs-nested-tabs"
version = "0.1.0"
description = "Display two levels of navigation.tabs instead of Material's hover-only dropdown."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Luka Sherman", email = "lukawritecode@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: MkDocs",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[project.urls]
Homepage = "https://github.com/luka-sherman/mkdocs-nested-tabs"
Repository = "https://github.com/luka-sherman/mkdocs-nested-tabs"
Issues = "https://github.com/luka-sherman/mkdocs-nested-tabs/issues"

[project.entry-points."mkdocs.plugins"]
nested-tabs = "mkdocs_nested_tabs.plugin:NestedTabsPlugin"

[tool.setuptools.packages.find]
include = ["mkdocs_nested_tabs*"]

[tool.setuptools.package-data]
mkdocs_nested_tabs = ["static/*"]
